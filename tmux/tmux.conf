# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 0

set -g history-limit 500000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

bind c new-window -b -c '#{pane_current_path}' #insert window after current window and not before

#refresh the status and panel and window information
set -g status-interval 5
# Enable mouse support
set -g mouse on

# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# ============================================
# KEY BINDINGS
# ============================================

bind r source-file ~/.config/tmux/tmux.conf ; display "Config reloaded successfully!"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ============================================
# APPEARANCE
# ============================================

set -g status-style 'bg=default'

# Right field:  date/time
set -g status-right-length 100 # number indicates number of characters and not pixel
set -g status-left-length 0 # number indicates number of characters and not pixel

set -g status-left ''
set -g status-right '#[bg=#{@ctp-surface0},fg=#{@ctp-peach}] %Y-%m-%d %H:%M:%S #[bg=default] #[default]'
set -g window-status-separator "|" # separator for 2 windows
set -g window-status-current-style nounderscore # removes the underscore for the selected window
set -g renumber-windows on #makes sure that when window is killed other are re numbered

## Window global/default configuration
set -g window-status-format ' #[fg=#{ctp-text},bold]#I #[fg=#{@ctp-text},bold]#W '
set -g window-status-style 'bg=#{@ctp-surface0}'

## Window current configuration
set -g window-status-current-format '#[fg=#{@ctp-red},bold] #[fg=#{@ctp-teal},bold]#I #[fg=#{@ctp-teal},bold]#W #[fg=#{@ctp-red},bold] '
set -g window-status-current-style 'bg=#{@ctp-surface0}'

## pane style options
set -g pane-border-status top
set -g pane-border-format '#{pane_index}:#{pane_current_path}'
set -g pane-active-border-style 'fg=#{@ctp-mauve}'

# Status bar position
set -g status-position top

# Pane scrollbars — show scrollback position (tmux 3.6+)
#set -g pane-scrollbars auto
#set -g pane-scrollbars-position right

# Use vi keys
setw -g mode-keys vi

